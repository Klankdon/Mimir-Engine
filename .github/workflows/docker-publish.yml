name: Publish Docker Image

on:
  release:
    types: [published]
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase GitHub Actor
        id: string
        run: |
          echo "actor_lowercase=${GITHUB_ACTOR,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.string.outputs.actor_lowercase }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/klankdon/mimir-engine:latest
            ghcr.io/klankdon/mimir-engine:${{ github.sha }}
